name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        working-directory: server
        run: swift test

      - name: Universal release binary
        run: scripts/build.sh

      - name: Check the binary answers MCP
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | COMPUTER_USE_HUD=0 bin/computer-use-server | tail -1 | python3 -c 'import sys,json; t=json.loads(sys.stdin.read())["result"]["tools"]; print(len(t), "tools"); assert len(t) > 15'

      - uses: actions/upload-artifact@v4
        with:
          name: computer-use-server
          path: bin/computer-use-server

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/computer-use-server --generate-notes
